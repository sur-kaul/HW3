<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="HW2Style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand" href="HW2Home.html">My Portfolio</a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#portfolioNavbar"
                    aria-controls="portfolioNavbar"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="portfolioNavbar">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="HW2Home.html">Home</a>
                    <a class="nav-link" href="HW2Skills.html">Skills</a>
                    <a class="nav-link" href="HW2Experience.html">Experience</a>
                    <a class="nav-link" href="HW2Projects.html">Projects</a>
                    <a class="nav-link" href="HW2Contact.html">Contact</a>
                </div>
            </div>

        </div>
    </nav>

    <header class="text-center py-5">
        <div class="container">
            <h1>Contact Me</h1>
            <p class="lead">
                Feel free to reach out about my projects, skills, or experience.
            </p>
        </div>
    </header>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <form>
                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" class="form-control"
                               id="name" name="name" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control"
                               id="email" name="email" required>
                    </div>

                    <div class="mb-3">
                        <label for="message" class="form-label">Message</label>
                        <textarea class="form-control" id="message"
                                  name="message" rows="5" required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Send Message
                    </button>
                </form>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
